<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Simulador Honcord</title>

    <link rel="icon" type="image/x-icon" href="../img/icon/cyber-crime-_1__1.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            primary: '#D83F3C',
                            primaryDark: '#9A1B1B',
                            tertiary: '#00638D',
                            darkest: '#3a2b2a',
                            bg: '#fcf5f5'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <!-- Cabeçalho -->
    <header class="bg-brand-darkest text-white h-16 flex items-center justify-between px-8 shadow-md">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-database text-xl text-brand-primary"></i>
            <h1 class="text-xl font-bold tracking-wide">Painel Administrativo - Simulador</h1>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="px-4 py-2 bg-brand-tertiary rounded hover:bg-blue-800 transition text-sm font-medium">
                <i class="fa-solid fa-play mr-2"></i> Jogar Simulador
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto py-8 px-4">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-700">Gerenciar Cenários</h2>
            <button onclick="openModal()" class="px-5 py-2.5 bg-brand-primaryDark text-white font-bold rounded shadow hover:bg-red-800 transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> Novo Cenário
            </button>
        </div>

        <!-- Tabela -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wide border-b border-gray-200">
                        <th class="px-6 py-4 font-semibold">ID</th>
                        <th class="px-6 py-4 font-semibold">Tipo</th>
                        <th class="px-6 py-4 font-semibold">Remetente</th>
                        <th class="px-6 py-4 font-semibold">Assunto</th>
                        <th class="px-6 py-4 font-semibold">Ameaça?</th>
                        <th class="px-6 py-4 font-semibold text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-100">
                    <tr>
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Carregando dados do servidor...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Formulário (Criar/Editar) -->
    <div id="form-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center backdrop-blur-sm p-4 overflow-y-auto">
        <div class="bg-white rounded-lg shadow-2xl max-w-4xl w-full my-8 relative">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-lg">
                <h3 id="modal-title" class="text-xl font-bold text-brand-darkest">Adicionar Cenário</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="scenario-form" onsubmit="saveScenario(event)" class="p-6">
                <input type="hidden" id="scenario_id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <!-- Tipo -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Módulo</label>
                        <select id="type" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-brand-tertiary focus:outline-none">
                            <option value="email">E-mail</option>
                            <option value="chat">Chat (Mensagem Direta)</option>
                        </select>
                    </div>
                    <!-- Phishing -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">É uma ameaça (Phishing)?</label>
                        <select id="isPhishing" required class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-red-500 focus:outline-none">
                            <option value="1">Sim (Ameaça)</option>
                            <option value="0">Não (Seguro)</option>
                        </select>
                    </div>
                    <!-- Nome -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Remetente</label>
                        <input type="text" id="senderName" required placeholder="Ex: Felipe Sousa - TI" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-brand-tertiary focus:outline-none">
                    </div>
                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">E-mail do Remetente (Deixe vazio se for Chat)</label>
                        <input type="text" id="senderEmail" placeholder="Ex: suporte@honc0rd.com.br" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-brand-tertiary focus:outline-none">
                    </div>
                    <!-- Assunto -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Assunto</label>
                        <input type="text" id="subject" required placeholder="Ex: URGENTE: Atualização de Senha" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-brand-tertiary focus:outline-none">
                    </div>
                    <!-- Conteúdo -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Conteúdo da Mensagem</label>
                        <textarea id="content" required rows="5" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-brand-tertiary focus:outline-none font-mono text-sm" placeholder="Para e-mail: Digite o texto (use \n para pular linha e [Botão] para links).&#10;Para chat: Cole o JSON de mensagens."></textarea>
                    </div>
                    <!-- Armadilha Visual -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">ID da Armadilha (Elemento que ficará com borda vermelha ao errar)</label>
                        <input type="text" id="trapElementId" placeholder="Ex: email-sender-address, email-body ou chat-message-container" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-brand-tertiary focus:outline-none">
                    </div>
                    <!-- Feedback Sucesso -->
                    <div>
                        <label class="block text-sm font-medium text-green-700 mb-1">Feedback de Acerto</label>
                        <textarea id="feedbackSuccess" required rows="2" class="w-full p-2 border border-green-300 rounded focus:ring-2 focus:ring-green-500 focus:outline-none"></textarea>
                    </div>
                    <!-- Feedback Erro -->
                    <div>
                        <label class="block text-sm font-medium text-red-700 mb-1">Feedback de Erro</label>
                        <textarea id="feedbackError" required rows="2" class="w-full p-2 border border-red-300 rounded focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
                    </div>
                    <!-- Dica -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-blue-700 mb-1">Dica de Segurança</label>
                        <input type="text" id="tip" required class="w-full p-2 border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="px-6 py-2 bg-gray-200 text-gray-700 font-medium rounded hover:bg-gray-300 transition">Cancelar</button>
                    <button type="submit" class="px-6 py-2 bg-brand-primaryDark text-white font-bold rounded shadow hover:bg-brand-primary transition flex items-center gap-2">
                        <i class="fa-solid fa-save"></i> Salvar Cenário
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Referência ao script externo -->
    <script src="../script/admin.js"></script>
</body>
</html>
